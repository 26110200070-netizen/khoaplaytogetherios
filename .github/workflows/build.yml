name: Build KhoaPlaytogether iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos & Dependencies
        run: |
          brew install ldid
          git clone --depth=1 --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz -C ~/theos/sdks --strip-components=1
          rm -f master.tar.gz

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1

      - name: Verify Built Dylib
        run: |
          ls -lh KhoaPlaytogether.dylib
          file KhoaPlaytogether.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhoaPlaytogether.dylib
          path: KhoaPlaytogether.dylib
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.33.0-b${{ github.run_number }}
          name: KhoaPlaytogether v2.33.0 (Build ${{ github.run_number }})
          body: |
            ### KhoaPlaytogether iOS Non-Jailbreak Mod Menu
            - Target: PlayTogether VNG 2.33.0 (arm64)
            - Architecture: Dear ImGui Metal overlay
            - Features: Auto Câu Cá (Tích hợp bóng 1-7 & Minigame), Auto Bảo Quản, Đóng Hộp Quà, Khai Khoáng, Bắt Bọ, Farm, Dịch Chuyển.
            - Hướng dẫn: Dùng Esign hoặc Sideloadly inject `KhoaPlaytogether.dylib` vào file IPA gốc.
          files: KhoaPlaytogether.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
